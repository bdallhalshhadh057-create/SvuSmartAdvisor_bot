<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار SVU الحقوقي</title>
    <style>
        body { font-family: sans-serif; background-color: #ffffff; padding: 15px; margin: 0; text-align: right; }
        .card { background: #f9f9f9; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
        select, input, button, textarea { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #2481cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .badge { background: #e3f2fd; color: #0d47a1; padding: 5px 10px; border-radius: 4px; display: inline-block; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول المبسطة -->
    <div id="login-box" class="card">
        <span class="badge">كلية الحقوق - SVU</span>
        <h3>🔑 تفعيل الاشتراك الرقمي</h3>
        <input type="password" id="pass" placeholder="أدخل كود الاشتراك التجريبي">
        <button onclick="simpleLogin()">دخول المنصة Direct</button>
        <p id="err" style="color:red; font-weight:bold;"></p>
        <hr>
        <h4>🛒 قيمة الاشتراك: 200,000 ل.س / 100 يوم</h4>
    </div>

    <!-- المنصة الرئيسية -->
    <div id="platform" class="hidden">
        <div class="card">
            <h2>المستشار الأكاديمي الحرفي ⚖️</h2>
            <label>اختر المقرر الدراسي الحركي:</label>
            <select id="subject-select">
                <option value="القانون التجاري">القانون التجاري</option>
                <option value="القانون المدني">القانون المدني</option>
                <option value="قانون العقوبات">قانون العقوبات</option>
            </select>
        </div>

        <div class="card">
            <h3>⚙️ الخدمات الذكية المتاحة</h3>
            <button onclick="callGemini('summary')">📖 توليد الشرح والتلخيص للمقرر</button>
            <button style="background-color: #43a047;" onclick="callGemini('quiz')">📝 سؤال أتمتة تجريبي (نمط SVU)</button>
        </div>

        <div id="result-card" class="card hidden">
            <h3 id="result-title">النتيجة:</h3>
            <div id="gemini-output" style="white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ddd;"></div>
        </div>

        <div class="card">
            <h3>✍️ حل الوظائف الفريدة (منع التشابه)</h3>
            <textarea id="homework-q" rows="3" placeholder="انسخ نص سؤال الوظيفة هنا..."></textarea>
            <button style="background-color: #e65100;" onclick="callGemini('homework')">صياغة حل الوظيفة</button>
        </div>
    </div>

    <script>
        function simpleLogin() {
            const pass = document.getElementById('pass').value;
            // فحص الكود مباشرة في الواجهة لتفادي مشاكل الاتصال الداخلي بالمتصفح
            if (pass === "SVU-LAW-99X" || pass === "SVU-VIP-777") {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('platform').classList.remove('hidden');
            } else {
                document.getElementById('err').innerText = "⚠️ كود الاشتراك غير صحيح!";
            }
        }

        function callGemini(taskType) {
            const sub = document.getElementById('subject-select').value;
            const qText = document.getElementById('homework-q').value;

            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('result-title').innerText = "⏳ جاري التوليد والمطابقة مع مناهج SVU...";
            document.getElementById('gemini-output').innerText = "الرجاء الانتظار ثوانٍ معدودة...";

            fetch('/ask-gemini', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subject: sub, task_type: taskType, input_text: qText })
            }).then(r => r.json()).then(res => {
                if(res.status === 'success') {
                    document.getElementById('result-title').innerText = "النتيجة القانونية المعتمدة:";
                    document.getElementById('gemini-output').innerText = res.result;
                } else {
                    document.getElementById('gemini-output').innerText = "خطأ: " + res.message;
                }
            }).catch(err => {
                document.getElementById('gemini-output').innerText = "فشل الاتصال بالسيرفر، تأكد من إضافة مفتاح جينماي لـ Render.";
            });
        }
    </script>
</body>
</html>
